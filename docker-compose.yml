services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: moba
      POSTGRES_PASSWORD: moba
      POSTGRES_DB: moba
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moba"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
